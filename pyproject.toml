[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botlooks"
version = "0.1.0"
description = "Telegram bot giving appearance and style advice from photos"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "openai>=3,<4",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "psycopg2-binary",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/botlooks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
